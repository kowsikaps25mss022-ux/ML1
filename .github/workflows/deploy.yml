name: HB Heartbeat Stability Prediction CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # STEP 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # STEP 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Validate Python application
      - name: Validate HB Application
        run: |
          python -m compileall -q .

      # STEP 5: Validate Heartbeat Model+
      - name: Validate Heartbeat Model
        run: |
          python -c "import joblib; print('Model loading library validated')"

      # STEP 6: Validate MLflow
      - name: Validate MLflow
        run: |
          python -c "import mlflow; import mlflow.sklearn; print('MLflow validation successful')"

      # STEP 7: Deploy to Render
      - name: Deploy to Render
        if: success()
        run: |
          curl --fail --silent --show-error \
          -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"